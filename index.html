<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>头像分级榜</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #242725; background: #f4f4ef; --card-size: 104px; --label-width: 210px; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .38; }
    button, input, select, textarea, summary { outline-offset: 4px; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid #48664c; }
    button { border: 1px solid #d8dbd3; background: #fff; color: inherit; border-radius: 8px; padding: 9px 13px; font-size: 13px; font-weight: 550; white-space: nowrap; transition: background .15s, border-color .15s; }
    button:hover:not(:disabled) { background: #f1f3ed; border-color: #a8b2a3; }
    .primary { background: #283e2c; color: #fff; border-color: #283e2c; }
    .primary:hover:not(:disabled) { background: #3a543d; border-color: #3a543d; }
    .quiet { border-color: transparent; background: transparent; }
    .danger { color: #a63d36; }
    .app-header { padding: 22px 30px 18px; background: #fbfbf7; border-bottom: 1px solid #dedfd7; }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; }
    .brand-mark { display: grid; gap: 3px; width: 25px; }
    .brand-mark i { display: block; height: 5px; border-radius: 1px; }
    .brand-mark i:nth-child(1) { background: #ee8881; width: 19px; }
    .brand-mark i:nth-child(2) { background: #edc27e; width: 25px; }
    .brand-mark i:nth-child(3) { background: #9acc79; width: 22px; }
    .brand-mark i:nth-child(4) { background: #91a4ba; width: 15px; }
    h1 { font-size: 19px; font-weight: 650; letter-spacing: -.6px; margin: 0; }
    .header-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .header-actions .divider { width: 1px; height: 22px; background: #dcded5; margin: 0 4px; }
    .project-menu { position: relative; }
    .project-menu summary { list-style: none; font-size: 13px; padding: 9px 10px; cursor: pointer; }
    .project-menu summary::-webkit-details-marker { display: none; }
    .menu-popover { position: absolute; z-index: 15; top: 39px; right: 0; padding: 5px; width: 170px; background: #fff; border: 1px solid #d8dbd3; border-radius: 10px; box-shadow: 0 12px 30px #252d2018; }
    .menu-popover button { width: 100%; text-align: left; border: 0; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; margin-top: 19px; }
    .project-title { width: 195px; border: 0; border-bottom: 1px solid #d6dacd; padding: 6px 0; border-radius: 0; background: transparent; font-size: 14px; font-weight: 550; }
    .range-control { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #697064; }
    .range-control input { width: 90px; accent-color: #48664c; }
    .range-control output { min-width: 30px; color: #393f37; font-variant-numeric: tabular-nums; }
    .check-control { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; color: #596251; }
    input[type="checkbox"] { accent-color: #48664c; }
    .history-controls { display: flex; gap: 3px; margin-left: auto; }
    .history-controls button { padding: 6px 9px; font-size: 12px; }
    .workspace { padding: 20px 30px 30px; max-width: 1900px; margin: auto; }
    .workspace-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 12px; color: #747d6e; }
    .workspace-meta strong { color: #434d3e; font-weight: 550; }
    .save-state { display: inline-flex; align-items: center; gap: 6px; }
    .save-state::before { content: ""; width: 5px; height: 5px; background: #829679; border-radius: 50%; }
    .save-state.warning { color: #a66a2b; }
    .save-state.warning::before { background: #bd873b; }
    .board-shell { border: 1px solid #20251f; background: #191c18; overflow-x: auto; }
    .board { background: #191c18; position: relative; }
    .tier-row { display: flex; height: var(--card-size); border-bottom: 1px solid #606b56; position: relative; }
    .tier-row:last-child { border-bottom: 0; }
    .tier-label { display: flex; align-items: center; justify-content: center; position: relative; width: min(var(--label-width), 42vw); flex-shrink: 0; border: 0; border-radius: 0; padding: 16px; white-space: normal; border-right: 1px solid #191c18; background: var(--tier-color); color: var(--tier-ink); font-weight: 750; }
    .tier-label:hover:not(:disabled) { background: var(--tier-color); border-color: #191c18; }
    .tier-label-text { font-size: clamp(17px, calc(var(--label-width) * .12), 32px); line-height: 1.35; overflow-wrap: anywhere; max-height: 100%; overflow: hidden; }
    .tier-label-hint { position: absolute; font-size: 10px; font-weight: 500; right: 9px; bottom: 5px; opacity: 0; transition: opacity .15s; }
    .tier-label:hover .tier-label-hint, .tier-label:focus-visible .tier-label-hint { opacity: .6; }
    .tier-items { flex: 1; min-width: 0; height: 100%; position: relative; }
    .tier-items.drop-over { box-shadow: inset 0 0 0 2px #dbe3cb80; }
    .board-stage { position: absolute; left: min(var(--label-width), 42vw); right: 0; top: 0; bottom: 0; pointer-events: none; }
    .board-stage > .avatar-card { position: absolute; pointer-events: auto; }
    .placing .board-stage { background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--card-size) - 1px), #ffffff22 calc(var(--card-size) - 1px), #ffffff22 var(--card-size)), repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--card-size) / 2 - 1px), #ffffff22 calc(var(--card-size) / 2 - 1px), #ffffff22 calc(var(--card-size) / 2)); }
    .grid-drop-preview { display: none; position: absolute; z-index: 6; width: var(--card-size); height: var(--card-size); border: 2px solid #c5f890; background: #c5f89018; pointer-events: none; }
    .grid-drop-preview.blocked { border-color: #f08c83; background: #f08c8328; }
    .grid-snap-line { display: none; position: absolute; z-index: 1; left: 0; right: 0; height: 2px; background: #c5f890; pointer-events: none; }
    .avatar-card { width: var(--card-size); height: var(--card-size); flex: 0 0 var(--card-size); display: block; border: 0; border-radius: 0; padding: 0; background: #31372d; position: relative; user-select: none; touch-action: none; }
    .avatar-card:hover:not(:disabled) { background: #31372d; border: 0; }
    .avatar-card img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
    .avatar-caption { position: absolute; bottom: 0; width: 100%; display: block; height: 22px; line-height: 22px; padding: 0 5px; color: #fff; background: #0009; font-size: 12px; font-weight: 650; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .avatar-card.selected { z-index: 3; box-shadow: inset 0 0 0 3px #f9fbef; outline: 2px solid #48664c; outline-offset: 1px; }
    .avatar-card.selected::after { content: ""; position: absolute; inset: 0; border: 3px solid #fff; pointer-events: none; }
    .avatar-card.dragging { opacity: .3; }
    .avatar-card.drag-ghost { position: fixed; z-index: 1000; pointer-events: none; outline: 2px solid #fff; box-shadow: 0 12px 30px #0005; }
    .avatar-card.insert-before::before, .avatar-card.insert-after::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: #fff7c4; z-index: 5; }
    .avatar-card.insert-before::before { left: -1px; }
    .avatar-card.insert-after::before { right: -1px; }
    .names-hidden .avatar-caption { display: none; }
    .board-footer { display: flex; align-items: center; justify-content: space-between; padding: 9px 0 15px; color: #7d8476; font-size: 11px; }
    .board-footer button { padding: 5px 0; font-size: 12px; }
    .pool-section { background: #fbfbf7; border: 1px solid #dddfd5; border-radius: 10px; padding: 15px 17px 17px; }
    .pool-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    h2 { font-size: 13px; margin: 0; font-weight: 650; }
    .pool-count { font-size: 11px; font-weight: 450; color: #7a8271; margin-left: 6px; }
    .pool-tools { display: flex; align-items: center; gap: 6px; }
    .pool-tools button { font-size: 12px; padding: 5px 9px; }
    .pool { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; min-height: 90px; }
    .pool.drop-over { outline: 2px dashed #8e9f82; outline-offset: 6px; }
    .empty-pool { min-height: 100px; width: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 7px; border: 1px dashed #ced3c3; border-radius: 5px; color: #6e7964; cursor: pointer; font-size: 13px; }
    .empty-pool small { color: #929a89; font-size: 11px; }
    .pool .avatar-card { border-radius: 4px; }
    .pool .avatar-card img { border-radius: 4px; }
    .pool .avatar-caption { border-radius: 0 0 4px 4px; }
    .replay-tools { display: flex; align-items: center; gap: 7px; }
    .replay-tools select { background: transparent; color: #626e57; border: 0; font-size: 12px; max-width: 95px; }
    .selection-note { color: #48664c; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px); z-index: 50; max-width: min(600px, 90vw); padding: 12px 18px; border-radius: 9px; background: #263729; color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 6px 26px #0002; }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    dialog { width: min(440px, calc(100vw - 30px)); border: 1px solid #daddd2; border-radius: 14px; padding: 25px; background: #fbfbf7; color: #242725; box-shadow: 0 24px 80px #0003; }
    dialog::backdrop { background: #1b241a66; backdrop-filter: blur(3px); }
    dialog h2 { font-size: 18px; margin-bottom: 22px; }
    .field { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; font-size: 12px; color: #68735d; }
    .field input[type="text"], .field textarea { width: 100%; border: 1px solid #cfd5c6; border-radius: 7px; padding: 10px; background: #fff; color: #242725; font-size: 15px; }
    .field textarea { min-height: 80px; resize: vertical; }
    .color-options { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .swatch { width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; padding: 0; box-shadow: 0 0 0 1px #d4d8ce; }
    .field input[type="color"] { padding: 0; width: 38px; height: 30px; border: 0; background: transparent; cursor: pointer; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 25px; }
    .dialog-secondary { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px solid #e0e3d9; padding-top: 14px; margin-top: 20px; }
    .dialog-secondary button { padding: 6px 9px; font-size: 12px; }
    .card-preview { width: 110px; height: 110px; display: block; border-radius: 7px; object-fit: cover; margin: 0 auto 20px; }
    .present-controls { display: none; }
    body.presenting { background: #191c18; min-height: 100vh; }
    .presenting .app-header, .presenting .workspace-meta, .presenting .board-footer, .presenting .pool-heading, .presenting .empty-pool { display: none; }
    .presenting .workspace { max-width: none; padding: 0; }
    .presenting .board-shell { border: 0; }
    .presenting .pool-section { background: #191c18; padding: 14px 10px; margin-top: 1px; border: 0; border-radius: 0; }
    .presenting .pool { gap: 0; min-height: var(--card-size); }
    .presenting .pool .avatar-card, .presenting .pool .avatar-card img, .presenting .pool .avatar-caption { border-radius: 0; }
    .presenting .tier-label-hint { display: none; }
    .presenting .present-controls { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 9px; position: fixed; right: 14px; bottom: 14px; z-index: 20; padding: 8px; border: 1px solid #ffffff35; border-radius: 10px; background: #171b16dd; opacity: .18; transition: opacity .15s; color: #e8ebdf; }
    .presenting .present-controls:hover, .presenting .present-controls:focus-within { opacity: 1; }
    .present-controls button { background: #ffffff10; color: #fff; border-color: #ffffff25; padding: 6px 10px; font-size: 12px; }
    .present-controls button:hover:not(:disabled) { background: #ffffff25; border-color: #ffffff65; }
    .present-controls .check-control { color: #e8ebdf; }
    .presenting.pool-hidden .pool-section { display: none; }
    .replaying .board, .replaying .pool { pointer-events: none; }
    .replay-stop { display: none; }
    .replaying .replay-stop { display: inline-block; }
    .replaying .replay-start { display: none; }
    @media (max-width: 950px) { .header-top { align-items: flex-start; } .header-actions { justify-content: flex-end; } .app-header { padding: 18px; } .workspace { padding: 16px 18px; } .toolbar { gap: 12px; } .history-controls { margin-left: 0; } }
    @media (max-width: 620px) { .header-top { flex-direction: column; gap: 14px; } .header-actions { justify-content: flex-start; gap: 5px; } .header-actions button { font-size: 12px; padding: 8px 10px; } .app-header { padding: 15px 12px; } .workspace { padding: 14px 10px; } .toolbar { gap: 10px 14px; } .project-title { width: 100%; } .range-control input { width: 65px; } .workspace-meta { align-items: flex-start; font-size: 11px; } .tier-label { padding: 10px; } .pool-section { padding: 12px; } .pool-heading { align-items: flex-start; } .pool-tools { flex-wrap: wrap; justify-content: flex-end; } .board-footer { font-size: 10px; gap: 12px; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>头像分级榜</h1></div>
      <div class="header-actions">
        <button class="primary" id="import-images">＋ 导入头像</button>
        <button id="save-html">保存完整 HTML</button>
        <button id="export-png">导出图片</button>
        <span class="divider" aria-hidden="true"></span>
        <button id="present">录制模式</button>
        <details class="project-menu" id="project-menu"><summary>更多 ▾</summary><div class="menu-popover"><button id="open-project">打开已保存榜单</button><button id="new-project">新建空白榜单</button></div></details>
      </div>
    </div>
    <div class="toolbar">
      <input class="project-title" id="project-title" aria-label="榜单名称" placeholder="榜单名称" maxlength="100">
      <label class="range-control">头像<input id="card-size" type="range" min="64" max="180" step="4"><output id="card-size-value"></output></label>
      <label class="range-control">标签宽度<input id="label-width" type="range" min="120" max="360" step="10"><output id="label-width-value"></output></label>
      <label class="check-control"><input type="checkbox" id="show-names">显示姓名</label>
      <div class="history-controls"><button id="undo" class="quiet" title="撤销 ⌘/Ctrl Z">↶ 撤销</button><button id="redo" class="quiet" title="重做 ⌘/Ctrl Shift Z">↷ 重做</button></div>
    </div>
  </header>
  <main class="workspace">
    <div class="workspace-meta"><span id="board-info"><strong>0</strong> 张头像</span><span class="save-state" id="save-state">正在载入</span></div>
    <div class="board-shell"><div class="board" id="board" aria-label="头像分级榜"></div></div>
    <div class="board-footer"><span id="interaction-note">拖到分界线可跨行 · 选中后方向键微调 · 双击改姓名</span><button id="add-row" class="quiet">＋ 添加一行</button></div>
    <section class="pool-section" aria-label="待选头像">
      <div class="pool-heading"><h2>待选头像<span id="pool-count" class="pool-count"></span></h2><div class="pool-tools"><button class="quiet" id="load-demo">载入示例</button><button class="quiet danger" id="clear-pool">清空待选头像</button><button class="quiet" id="reset-layout">清空排位</button><div class="replay-tools"><select id="replay-interval" aria-label="回放移动间隔"><option value="600">间隔 0.6 秒</option><option value="1000" selected>间隔 1 秒</option><option value="1600">间隔 1.6 秒</option><option value="2500">间隔 2.5 秒</option></select><button id="replay" class="replay-start">▶ 回放移动</button><button id="stop-replay" class="replay-stop">停止回放</button></div></div></div>
      <div id="pool" class="pool" aria-label="待选区"></div>
    </section>
  </main>
  <div class="present-controls"><label class="check-control"><input type="checkbox" id="present-pool" checked>待选区</label><button id="present-reset-layout">清空排位</button><button id="present-replay" class="replay-start">▶ 回放</button><button id="present-stop" class="replay-stop">停止</button><button id="exit-present">退出 · Esc</button></div>
  <dialog id="row-dialog"><form id="row-form"><h2>编辑分级行</h2><label class="field">分级名称<textarea id="row-name" required maxlength="100"></textarea></label><div class="field">背景颜色<div class="color-options" id="color-options"></div></div><div class="dialog-secondary"><button type="button" id="delete-row" class="quiet danger">删除此行</button><div><button type="button" id="row-up">↑ 上移</button> <button type="button" id="row-down">↓ 下移</button></div></div><div class="dialog-actions"><button type="button" data-close="row-dialog">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
  <dialog id="card-dialog"><form id="card-form"><h2>编辑头像</h2><img id="card-preview" class="card-preview" alt="当前头像"><label class="field">姓名<input id="card-name" type="text" maxlength="100" required></label><div class="dialog-secondary"><button type="button" id="delete-card" class="quiet danger">移除头像</button><button type="button" id="return-card">移回待选区</button></div><div class="dialog-actions"><button type="button" data-close="card-dialog">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="images-input" type="file" accept="image/*" multiple hidden>
  <input id="project-input" type="file" accept=".html,.htm,.json" hidden>

  <script>
    'use strict';
    const sourceMarkup = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const $ = id => document.getElementById(id);
    const palette = ['#ef8983', '#f4c58b', '#f9e28b', '#c5f890', '#83d96d', '#91a4ba'];
    const defaultLabels = ['夯', '顶级', '人上人', 'NPC', '拉完了'];
    let project;
    let database;
    let selectedCard = null;
    let draggedCard = null;
    let pointerDrag = null;
    let suppressClickUntil = 0;
    let editingRow = null;
    let editingCard = null;
    let toastTimer;
    let saveTimer;
    let undoStack = [];
    let redoStack = [];
    let importBusy = false;
    const replay = { active: false, cancelled: false, original: null, wake: null };

    function newId() {
      return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function emptyProject(id = newId()) {
      const rows = defaultLabels.map((label, index) => ({ id: newId(), label, color: palette[index], items: [] }));
      return { format: 'avatar-tier-board', version: 2, id, title: '我的头像分级榜', updatedAt: 0, options: { cardSize: 104, labelWidth: 210, showNames: true }, rows, cards: {}, pool: [], positions: {}, moves: [], baseline: { rows: Object.fromEntries(rows.map(row => [row.id, []])), pool: [], positions: {} } };
    }

    function copyPositions(positions) {
      return Object.fromEntries(Object.entries(positions || {}).map(([id, position]) => [id, { ...position }]));
    }

    function positionsForRows(rows) {
      return Object.fromEntries(rows.flatMap(row => row.items.map((id, column) => [id, { rowId: row.id, column }])));
    }

    function copyLayout(layout) {
      return { rows: Object.fromEntries(Object.entries(layout.rows).map(([id, items]) => [id, [...items]])), pool: [...layout.pool], positions: copyPositions(layout.positions) };
    }

    function snapshot() {
      return { ...project, options: { ...project.options }, rows: project.rows.map(row => ({ ...row, items: [...row.items] })), cards: { ...project.cards }, pool: [...project.pool], positions: copyPositions(project.positions), moves: project.moves.map(move => ({ ...move, position: move.position ? { ...move.position } : null })), baseline: copyLayout(project.baseline) };
    }

    function currentLayout() {
      return { rows: Object.fromEntries(project.rows.map(row => [row.id, [...row.items]])), pool: [...project.pool], positions: copyPositions(project.positions) };
    }

    function applyLayout(layout) {
      project.rows.forEach(row => { row.items = [...(layout.rows[row.id] || [])]; });
      project.pool = [...layout.pool];
      project.positions = copyPositions(layout.positions);
    }

    function halfRow(position, rows = project.rows) {
      return rows.findIndex(row => row.id === position.rowId) * 2 + Number(Boolean(position.nextRowId));
    }

    function validRowPair(position, rows = project.rows) {
      const index = rows.findIndex(row => row.id === position.rowId);
      return index >= 0 && (!position.nextRowId || rows[index + 1]?.id === position.nextRowId);
    }

    function canPlaceCard(id, position, positions = project.positions, rows = project.rows) {
      if (!validRowPair(position, rows) || !Number.isInteger(position.column) || position.column < 0) return false;
      const start = halfRow(position, rows);
      return !Object.entries(positions).some(([otherId, other]) => otherId !== id && other.column === position.column && Math.abs(halfRow(other, rows) - start) < 2);
    }

    function firstFreePosition(id, rowId) {
      const position = { rowId, column: 0 };
      while (!canPlaceCard(id, position)) position.column++;
      return position;
    }

    function returnToPool(ids) {
      const removed = new Set(ids);
      project.rows.forEach(row => { row.items = row.items.filter(id => !removed.has(id)); });
      ids.forEach(id => { delete project.positions[id]; });
      project.pool.push(...ids);
    }

    function releaseBrokenBoundaries() {
      const ids = Object.entries(project.positions).filter(([, position]) => !validRowPair(position)).map(([id]) => id);
      returnToPool(ids);
      return ids.length;
    }

    function checkpoint() {
      undoStack.push(snapshot());
      if (undoStack.length > 40) undoStack.shift();
      redoStack = [];
    }

    function resetRecording() {
      project.moves = [];
      project.baseline = currentLayout();
    }

    function notify(message) {
      $('toast').textContent = message;
      $('toast').classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('visible'), 3200);
    }

    function setSaveStatus(message, warning = false) {
      $('save-state').textContent = message;
      $('save-state').classList.toggle('warning', warning);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('avatar-tier-board', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('projects', { keyPath: 'id' });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function readLocalProject(id) {
      return new Promise((resolve, reject) => {
        const request = database.transaction('projects').objectStore('projects').get(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function saveLocally() {
      if (!database) {
        setSaveStatus('请用“保存完整 HTML”保留榜单', true);
        return;
      }
      const transaction = database.transaction('projects', 'readwrite');
      transaction.objectStore('projects').put(snapshot());
      transaction.oncomplete = () => setSaveStatus('已自动保存到此浏览器');
      transaction.onerror = () => setSaveStatus('自动保存失败，请保存完整 HTML', true);
      transaction.onabort = () => setSaveStatus('自动保存失败，请保存完整 HTML', true);
    }

    function changed(animate = false, origin = null) {
      project.updatedAt = Date.now();
      render(animate, origin);
      setSaveStatus('正在保存');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveLocally, 250);
    }

    function readableInk(hex) {
      const value = hex.replace('#', '');
      const rgb = [0, 2, 4].map(offset => parseInt(value.slice(offset, offset + 2), 16));
      return rgb[0] * .299 + rgb[1] * .587 + rgb[2] * .114 > 145 ? '#11170f' : '#ffffff';
    }

    function makeCard(id) {
      const card = project.cards[id];
      const button = document.createElement('button');
      button.className = 'avatar-card';
      button.dataset.cardId = id;
      button.draggable = false;
      button.type = 'button';
      button.title = card.name + ' · 拖动归类，双击编辑';
      button.setAttribute('aria-label', card.name);
      button.classList.toggle('selected', selectedCard === id);
      const image = document.createElement('img');
      image.src = card.src;
      image.alt = '';
      image.draggable = false;
      const caption = document.createElement('span');
      caption.className = 'avatar-caption';
      caption.textContent = card.name;
      button.append(image, caption);
      return button;
    }

    function updateSelection() {
      document.querySelectorAll('.avatar-card').forEach(card => card.classList.toggle('selected', selectedCard === card.dataset.cardId));
      document.querySelectorAll('.tier-label-hint').forEach(hint => { hint.textContent = selectedCard ? '点击归入此行' : '编辑'; });
      $('interaction-note').textContent = selectedCard ? '已选择 ' + project.cards[selectedCard].name + ' · 点击半格放置或用方向键微调 · Esc 取消' : '拖到分界线可跨行 · 选中后方向键微调 · 双击改姓名';
      $('interaction-note').classList.toggle('selection-note', Boolean(selectedCard));
      document.body.classList.toggle('placing', Boolean(selectedCard) || Boolean(pointerDrag?.active));
    }

    function render(animate = false, origin = null) {
      const previous = new Map();
      if (animate) document.querySelectorAll('.avatar-card').forEach(card => previous.set(card.dataset.cardId, card.getBoundingClientRect()));
      if (origin) previous.set(origin.id, origin.rect);
      document.documentElement.style.setProperty('--card-size', project.options.cardSize + 'px');
      document.documentElement.style.setProperty('--label-width', project.options.labelWidth + 'px');
      document.body.classList.toggle('names-hidden', !project.options.showNames);
      const fragment = document.createDocumentFragment();
      for (const row of project.rows) {
        const element = document.createElement('section');
        element.className = 'tier-row';
        element.dataset.rowId = row.id;
        const label = document.createElement('button');
        label.className = 'tier-label';
        label.type = 'button';
        label.style.setProperty('--tier-color', row.color);
        label.style.setProperty('--tier-ink', readableInk(row.color));
        label.setAttribute('aria-label', '编辑分级行 ' + row.label);
        const text = document.createElement('span');
        text.className = 'tier-label-text';
        text.textContent = row.label;
        const hint = document.createElement('span');
        hint.className = 'tier-label-hint';
        hint.textContent = selectedCard ? '点击归入此行' : '编辑';
        label.append(text, hint);
        const items = document.createElement('div');
        items.className = 'tier-items';
        items.dataset.containerId = row.id;
        element.append(label, items);
        fragment.append(element);
      }
      $('board').replaceChildren(fragment);
      const labelWidth = $('board').querySelector('.tier-label').getBoundingClientRect().width;
      const columns = Math.max(1, ...Object.values(project.positions).map(position => position.column + 1));
      $('board').style.minWidth = Math.ceil(labelWidth + columns * project.options.cardSize) + 'px';
      const stage = document.createElement('div');
      stage.className = 'board-stage';
      for (const row of project.rows) {
        for (const id of row.items) {
          const position = project.positions[id];
          const card = makeCard(id);
          card.style.left = position.column * project.options.cardSize + 'px';
          card.style.top = halfRow(position) * project.options.cardSize / 2 + 'px';
          const label = position.nextRowId ? row.label + '与' + project.rows.find(row => row.id === position.nextRowId).label + '之间' : row.label;
          card.title = project.cards[id].name + ' · ' + label + ' · 拖动归类，双击编辑';
          stage.append(card);
        }
      }
      const preview = document.createElement('div');
      preview.className = 'grid-drop-preview';
      preview.id = 'grid-drop-preview';
      const snapLine = document.createElement('div');
      snapLine.className = 'grid-snap-line';
      snapLine.id = 'grid-snap-line';
      stage.append(preview, snapLine);
      $('board').append(stage);
      const pool = document.createDocumentFragment();
      project.pool.forEach(id => pool.append(makeCard(id)));
      if (!project.pool.length) {
        const empty = document.createElement('button');
        empty.type = 'button';
        empty.className = 'empty-pool';
        const line = document.createElement('span');
        line.textContent = Object.keys(project.cards).length ? '所有头像均已归类' : '导入头像，开始排列';
        const sub = document.createElement('small');
        sub.textContent = '选择图片或把图片文件拖到这里 · 文件名自动作为姓名';
        empty.append(line, sub);
        pool.append(empty);
      }
      $('pool').replaceChildren(pool);
      $('pool').dataset.containerId = 'pool';
      $('project-title').value = project.title;
      $('card-size').value = project.options.cardSize;
      $('label-width').value = project.options.labelWidth;
      $('card-size-value').value = project.options.cardSize;
      $('label-width-value').value = project.options.labelWidth;
      $('show-names').checked = project.options.showNames;
      $('pool-count').textContent = project.pool.length + ' 张';
      $('board-info').textContent = project.rows.length + ' 个分级 · ' + Object.keys(project.cards).length + ' 张头像';
      $('undo').disabled = !undoStack.length || replay.active;
      $('redo').disabled = !redoStack.length || replay.active;
      $('clear-pool').disabled = !project.pool.length || replay.active;
      $('present-reset-layout').disabled = replay.active;
      $('replay').disabled = !project.moves.length;
      $('present-replay').disabled = !project.moves.length;
      updateSelection();
      document.title = project.title + ' · 头像分级榜';
      if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelectorAll('.avatar-card').forEach(card => {
          const before = previous.get(card.dataset.cardId);
          if (!before) return;
          const after = card.getBoundingClientRect();
          const dx = before.left - after.left;
          const dy = before.top - after.top;
          if (Math.abs(dx) + Math.abs(dy) < 1) return;
          card.style.zIndex = '4';
          const animation = card.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }], { duration: 440, easing: 'cubic-bezier(.22,.75,.28,1)' });
          animation.onfinish = () => { card.style.zIndex = ''; };
        });
      }
    }

    function containerItems(id) {
      return id === 'pool' ? project.pool : project.rows.find(row => row.id === id).items;
    }

    function moveCard(id, target, requestedIndex, record = true, placement = null) {
      if (!project.cards[id]) return false;
      const source = project.pool.includes(id) ? 'pool' : project.rows.find(row => row.items.includes(id))?.id;
      if (!source) return false;
      const sourceItems = containerItems(source);
      const targetItems = containerItems(target);
      const oldIndex = sourceItems.indexOf(id);
      let index = targetItems.length;
      let position = null;
      if (target === 'pool') {
        index = Math.min(requestedIndex ?? targetItems.length, targetItems.length);
        if (source === target && oldIndex < index) index--;
        if (source === target && oldIndex === index) return false;
      } else {
        position = placement || firstFreePosition(id, target);
        if (!canPlaceCard(id, position)) { notify('目标半格已被占用，请放到空列或其他半格'); return false; }
        const previous = project.positions[id];
        if (previous && previous.rowId === position.rowId && previous.nextRowId === position.nextRowId && previous.column === position.column) return false;
      }
      if (record) checkpoint();
      sourceItems.splice(oldIndex, 1);
      targetItems.splice(index, 0, id);
      delete project.positions[id];
      if (position) {
        project.positions[id] = { ...position };
        targetItems.sort((a, b) => project.positions[a].column - project.positions[b].column);
        index = targetItems.indexOf(id);
      }
      if (record) project.moves.push({ id, target, index, position: position ? { ...position } : null });
      selectedCard = null;
      return true;
    }

    function applyRecordedMove(move) {
      project.pool = project.pool.filter(id => id !== move.id);
      project.rows.forEach(row => { row.items = row.items.filter(id => id !== move.id); });
      delete project.positions[move.id];
      containerItems(move.target).splice(move.index, 0, move.id);
      if (move.legacy) project.positions = positionsForRows(project.rows);
      else if (move.position) project.positions[move.id] = { ...move.position };
    }

    function placeSelected(target) {
      if (replay.active || !selectedCard) return;
      if (moveCard(selectedCard, target)) changed(true);
    }

    function clearDropHints() {
      document.querySelectorAll('.drop-over, .insert-before, .insert-after').forEach(element => element.classList.remove('drop-over', 'insert-before', 'insert-after'));
      if ($('grid-drop-preview')) $('grid-drop-preview').style.display = 'none';
      if ($('grid-snap-line')) $('grid-snap-line').style.display = 'none';
    }

    function dropLocation(event) {
      const pool = $('pool').getBoundingClientRect();
      const x = event.clientX;
      const y = event.clientY;
      if (x >= pool.left && x <= pool.right && y >= pool.top && y <= pool.bottom) {
        const card = event.target?.closest('#pool .avatar-card');
        let index = project.pool.length;
        let after = false;
        if (card) {
          after = x > card.getBoundingClientRect().left + project.options.cardSize / 2;
          index = project.pool.indexOf(card.dataset.cardId) + Number(after);
          if (card.dataset.cardId === draggedCard) index = project.pool.indexOf(draggedCard);
        }
        return { target: 'pool', index, card, after, container: $('pool'), valid: true };
      }
      const bounds = $('board').getBoundingClientRect();
      const label = $('board').querySelector('.tier-label').getBoundingClientRect();
      if (x < bounds.left || x > bounds.right || y < bounds.top || y >= bounds.bottom) return null;
      const size = project.options.cardSize;
      const relativeY = y - bounds.top;
      const rowIndex = Math.floor(relativeY / size);
      const id = draggedCard || selectedCard;
      let position;
      if (x < label.right) position = firstFreePosition(id, project.rows[rowIndex].id);
      else {
        const boundary = Math.round(relativeY / size);
        const between = boundary > 0 && boundary < project.rows.length && Math.abs(relativeY - boundary * size) <= Math.min(16, size * .15);
        const row = between ? boundary - 1 : rowIndex;
        position = { rowId: project.rows[row].id, column: Math.floor((x - label.right) / size) };
        if (between) position.nextRowId = project.rows[boundary].id;
      }
      return { target: position.rowId, position, valid: canPlaceCard(id, position) };
    }

    function pointerLocation(drag) {
      const x = drag.x - drag.offsetX + project.options.cardSize / 2;
      const y = drag.y - drag.offsetY + project.options.cardSize / 2;
      return dropLocation({ target: document.elementFromPoint(x, y), clientX: x, clientY: y });
    }

    function updatePointerDrag() {
      if (!pointerDrag?.active) return;
      const drag = pointerDrag;
      drag.ghost.style.left = drag.x - drag.offsetX + 'px';
      drag.ghost.style.top = drag.y - drag.offsetY + 'px';
      const location = pointerLocation(drag);
      clearDropHints();
      if (!location) return;
      if (location.target === 'pool') {
        location.container.classList.add('drop-over');
        if (location.card && location.card.dataset.cardId !== draggedCard) location.card.classList.add(location.after ? 'insert-after' : 'insert-before');
        return;
      }
      const position = location.position;
      const size = project.options.cardSize;
      const left = position.column * size;
      const top = halfRow(position) * size / 2;
      const preview = $('grid-drop-preview');
      preview.style.display = 'block';
      preview.style.left = left + 'px';
      preview.style.top = top + 'px';
      preview.classList.toggle('blocked', !location.valid);
      if (position.nextRowId) {
        $('grid-snap-line').style.display = 'block';
        $('grid-snap-line').style.top = top + size / 2 + 'px';
      }
      if (location.valid) {
        const stage = $('board').querySelector('.board-stage').getBoundingClientRect();
        drag.ghost.style.left = stage.left + left + 'px';
        drag.ghost.style.top = stage.top + top + 'px';
      }
    }

    function scrollWhileDragging() {
      if (!pointerDrag?.active) return;
      if (pointerDrag.y < 55) window.scrollBy(0, -12);
      else if (pointerDrag.y > innerHeight - 55) window.scrollBy(0, 12);
      const shell = $('board').parentElement;
      const bounds = shell.getBoundingClientRect();
      if (pointerDrag.y >= bounds.top && pointerDrag.y <= bounds.bottom) {
        if (pointerDrag.x < bounds.left + 35) shell.scrollBy(-12, 0);
        else if (pointerDrag.x > bounds.right - 35) shell.scrollBy(12, 0);
      }
      updatePointerDrag();
      requestAnimationFrame(scrollWhileDragging);
    }

    function finishPointerDrag() {
      if (!pointerDrag) return;
      pointerDrag.source.classList.remove('dragging');
      pointerDrag.ghost?.remove();
      pointerDrag = null;
      draggedCard = null;
      clearDropHints();
      document.body.classList.toggle('placing', Boolean(selectedCard));
    }

    async function imageToData(file) {
      const url = URL.createObjectURL(file);
      try {
        const image = await loadImage(url);
        const ratio = Math.min(1, 600 / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
        const context = canvas.getContext('2d');
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', .88);
      } finally { URL.revokeObjectURL(url); }
    }

    async function importImages(files) {
      if (importBusy || replay.active) return;
      const images = Array.from(files).filter(file => file.type.startsWith('image/'));
      if (!images.length) { notify('请选择 JPG、PNG、WebP 等图片文件'); return; }
      importBusy = true;
      $('import-images').disabled = true;
      const cards = [];
      let failed = 0;
      for (let index = 0; index < images.length; index++) {
        $('import-images').textContent = `导入中 ${index + 1}/${images.length}`;
        try {
          const file = images[index];
          cards.push({ id: newId(), name: file.name.replace(/\.[^.]+$/, '') || '未命名头像', src: await imageToData(file) });
        } catch { failed++; }
      }
      if (cards.length) {
        checkpoint();
        for (const card of cards) {
          project.cards[card.id] = card;
          project.pool.push(card.id);
          project.baseline.pool.push(card.id);
        }
        changed();
      }
      importBusy = false;
      $('import-images').disabled = false;
      $('import-images').textContent = '＋ 导入头像';
      $('images-input').value = '';
      notify(`已导入 ${cards.length} 张头像` + (failed ? `，${failed} 张图片无法读取` : '，双击头像可修改姓名'));
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('图片无法读取'));
        image.src = src;
      });
    }

    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function filename() {
      return (project.title.trim() || '头像分级榜').replace(/[\\/:*?"<>|]/g, '_');
    }

    function saveHtml() {
      if (replay.active) return;
      const saved = snapshot();
      saved.id = newId();
      saved.updatedAt = Date.now();
      const html = new DOMParser().parseFromString(sourceMarkup, 'text/html');
      html.getElementById('saved-state').textContent = JSON.stringify(saved).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
      html.title = project.title + ' · 头像分级榜';
      download(new Blob(['<!DOCTYPE html>\n' + html.documentElement.outerHTML], { type: 'text/html;charset=utf-8' }), filename() + '.html');
      notify('完整 HTML 已保存，包含头像、姓名、排位和移动记录');
    }

    function validateProject(value) {
      if (value?.format !== 'avatar-tier-board' || ![1, 2].includes(value.version) || !Array.isArray(value.rows) || !value.rows.length || !value.cards || !Array.isArray(value.pool) || !value.baseline || !Array.isArray(value.moves)) throw new Error('请选择本工具保存的完整 HTML');
      const placed = new Set();
      for (const id of [...value.pool, ...value.rows.flatMap(row => row.items)]) {
        if (!value.cards[id] || placed.has(id)) throw new Error('榜单中的头像数据不完整');
        placed.add(id);
      }
      if (placed.size !== Object.keys(value.cards).length) throw new Error('榜单中的头像数据不完整');
      for (const card of Object.values(value.cards)) {
        if (typeof card.name !== 'string' || !/^data:image\/(jpeg|png|webp|gif);base64,/.test(card.src)) throw new Error('榜单中的图片格式无法读取');
      }
      value.options.cardSize = Math.max(64, Math.min(180, Number(value.options.cardSize) || 104));
      value.options.labelWidth = Math.max(120, Math.min(360, Number(value.options.labelWidth) || 210));
      if (value.version === 1) {
        value.positions = positionsForRows(value.rows);
        value.baseline.positions = positionsForRows(value.rows.map(row => ({ ...row, items: value.baseline.rows[row.id] || [] })));
        value.moves = value.moves.map(move => ({ ...move, legacy: true }));
        value.version = 2;
      }
      validatePositions(value.rows, value.positions);
      validatePositions(value.rows.map(row => ({ ...row, items: value.baseline.rows[row.id] || [] })), value.baseline.positions);
      return value;
    }

    function validatePositions(rows, positions) {
      const count = rows.reduce((total, row) => total + row.items.length, 0);
      if (!positions || Object.keys(positions).length !== count) throw new Error('榜单的头像位置数据不完整');
      for (const row of rows) {
        for (const id of row.items) {
          const position = positions[id];
          if (!position || position.rowId !== row.id || !canPlaceCard(id, position, positions, rows)) throw new Error('榜单存在重叠或失效的头像位置');
        }
      }
    }

    async function openProject(file) {
      if (!file || replay.active) return;
      try {
        const text = await file.text();
        const payload = file.name.toLowerCase().endsWith('.json') ? text : new DOMParser().parseFromString(text, 'text/html').getElementById('saved-state')?.textContent;
        const value = validateProject(JSON.parse(payload));
        checkpoint();
        value.id = project.id;
        project = value;
        selectedCard = null;
        changed();
        notify('榜单已打开');
      } catch (error) { notify(error.message || '榜单文件无法读取'); }
      $('project-input').value = '';
    }

    function wrapText(context, text, maxWidth) {
      const lines = [];
      let line = '';
      for (const character of text) {
        if (character === '\n') { lines.push(line); line = ''; continue; }
        if (line && context.measureText(line + character).width > maxWidth) { lines.push(line); line = character; }
        else line += character;
      }
      lines.push(line);
      return lines;
    }

    function drawLabel(context, row, rect, left, top) {
      context.fillStyle = row.color;
      context.fillRect(left, top, rect.width, rect.height);
      let fontSize = Math.min(32, Math.max(17, project.options.labelWidth * .12));
      let lines;
      do {
        context.font = `750 ${fontSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
        lines = wrapText(context, row.label, rect.width - 30);
        if (lines.length * fontSize * 1.35 <= rect.height - 18 || fontSize <= 12) break;
        fontSize--;
      } while (fontSize > 11);
      context.fillStyle = readableInk(row.color);
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      lines.forEach((line, index) => context.fillText(line, left + rect.width / 2, top + rect.height / 2 + (index - (lines.length - 1) / 2) * fontSize * 1.35));
    }

    function fitCaption(context, text, width) {
      if (context.measureText(text).width <= width) return text;
      let shortened = text;
      while (shortened.length && context.measureText(shortened + '…').width > width) shortened = shortened.slice(0, -1);
      return shortened + '…';
    }

    async function exportPng() {
      if (replay.active) return;
      $('export-png').disabled = true;
      try {
        $('board').getAnimations({ subtree: true }).forEach(animation => animation.finish());
        const bounds = $('board').getBoundingClientRect();
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bounds.width * 2);
        canvas.height = Math.round(bounds.height * 2);
        const context = canvas.getContext('2d');
        context.scale(2, 2);
        context.fillStyle = '#191c18';
        context.fillRect(0, 0, bounds.width, bounds.height);
        const showNames = project.options.showNames;
        const downloadName = filename();
        const exportedRows = project.rows.map(row => {
          const element = [...$('board').children].find(element => element.dataset.rowId === row.id);
          return { row: { ...row }, label: element.querySelector('.tier-label').getBoundingClientRect(), rect: element.getBoundingClientRect() };
        });
        const exportedCards = project.rows.flatMap(row => row.items.map(id => ({
          card: { ...project.cards[id] },
          rect: $('board').querySelector(`[data-card-id="${id}"]`).getBoundingClientRect()
        })));
        for (const { row, label, rect } of exportedRows) {
          drawLabel(context, row, label, label.left - bounds.left, label.top - bounds.top);
          context.strokeStyle = '#191c18';
          context.lineWidth = 1;
          context.beginPath();
          context.moveTo(label.right - bounds.left - .5, label.top - bounds.top);
          context.lineTo(label.right - bounds.left - .5, label.bottom - bounds.top);
          context.stroke();
          context.strokeStyle = '#606b56';
          context.beginPath();
          context.moveTo(0, rect.bottom - bounds.top - .5);
          context.lineTo(bounds.width, rect.bottom - bounds.top - .5);
          context.stroke();
        }
        for (const { card, rect } of exportedCards) {
          const image = await loadImage(card.src);
          const crop = Math.min(image.naturalWidth, image.naturalHeight);
          const x = rect.left - bounds.left;
          const y = rect.top - bounds.top;
          context.drawImage(image, (image.naturalWidth - crop) / 2, (image.naturalHeight - crop) / 2, crop, crop, x, y, rect.width, rect.height);
          if (showNames) {
            context.fillStyle = '#0009';
            context.fillRect(x, y + rect.height - 22, rect.width, 22);
            context.font = '650 12px -apple-system, "PingFang SC", sans-serif';
            context.fillStyle = '#fff';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(fitCaption(context, card.name, rect.width - 10), x + rect.width / 2, y + rect.height - 11);
          }
        }
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('图片导出失败');
        download(blob, downloadName + '.png');
        notify(`已导出 ${canvas.width} × ${canvas.height} PNG 图片`);
      } catch (error) { notify(error.message || '图片导出失败'); }
      $('export-png').disabled = false;
    }

    function waitForReplay(milliseconds) {
      return new Promise(resolve => {
        const timer = setTimeout(() => { replay.wake = null; resolve(); }, milliseconds);
        replay.wake = () => { clearTimeout(timer); replay.wake = null; resolve(); };
      });
    }

    async function playMoves() {
      if (replay.active || !project.moves.length || importBusy) return;
      clearTimeout(saveTimer);
      replay.original = snapshot();
      replay.active = true;
      replay.cancelled = false;
      selectedCard = null;
      document.body.classList.add('replaying');
      document.querySelectorAll('.app-header button, .app-header input, .app-header select, #load-demo, #clear-pool, #reset-layout, #present-reset-layout, #add-row').forEach(element => { element.disabled = true; });
      const moves = [...project.moves];
      applyLayout(project.baseline);
      render();
      await waitForReplay(650);
      for (let index = 0; index < moves.length && !replay.cancelled; index++) {
        const move = moves[index];
        applyRecordedMove(move);
        render(true);
        $('board-info').textContent = `回放 ${index + 1} / ${moves.length}`;
        await waitForReplay(Number($('replay-interval').value));
      }
      const cancelled = replay.cancelled;
      project = replay.original;
      replay.original = null;
      replay.active = false;
      document.body.classList.remove('replaying');
      document.querySelectorAll('.app-header button, .app-header input, .app-header select, #load-demo, #clear-pool, #reset-layout, #present-reset-layout, #add-row').forEach(element => { element.disabled = false; });
      render();
      saveLocally();
      notify(cancelled ? '已停止回放' : '移动回放完成');
    }

    function stopReplay() {
      replay.cancelled = true;
      replay.wake?.();
    }

    function showRowEditor(id) {
      if (replay.active) return;
      editingRow = id;
      const row = project.rows.find(row => row.id === id);
      $('row-name').value = row.label;
      $('row-color').value = row.color;
      const index = project.rows.indexOf(row);
      $('row-up').disabled = index === 0;
      $('row-down').disabled = index === project.rows.length - 1;
      $('delete-row').disabled = project.rows.length === 1;
      $('row-dialog').showModal();
    }

    function reorderRow(direction) {
      const index = project.rows.findIndex(row => row.id === editingRow);
      const target = index + direction;
      if (target < 0 || target >= project.rows.length) return;
      checkpoint();
      [project.rows[index], project.rows[target]] = [project.rows[target], project.rows[index]];
      const returned = releaseBrokenBoundaries();
      if (returned) resetRecording();
      changed();
      $('row-dialog').close();
      notify(returned ? `分级行顺序已更新，${returned} 张跨行头像已移回待选区` : '分级行顺序已更新');
    }

    function showCardEditor(id) {
      if (replay.active) return;
      editingCard = id;
      selectedCard = null;
      updateSelection();
      $('card-name').value = project.cards[id].name;
      $('card-preview').src = project.cards[id].src;
      $('card-dialog').showModal();
    }

    function undo(redo = false) {
      if (replay.active || importBusy) return;
      const from = redo ? redoStack : undoStack;
      const to = redo ? undoStack : redoStack;
      if (!from.length) return;
      to.push(snapshot());
      project = from.pop();
      selectedCard = null;
      changed(true);
    }

    function setPresent(enabled) {
      document.body.classList.toggle('presenting', enabled);
      if (enabled) {
        selectedCard = null;
        document.body.classList.toggle('pool-hidden', !$('present-pool').checked);
        render();
        window.scrollTo(0, 0);
        notify('录制模式已开启，右下角可回放和退出，也可按 Esc');
      } else document.body.classList.remove('pool-hidden');
    }

    function clearPendingAvatars() {
      if (replay.active || importBusy || !project.pool.length) return;
      checkpoint();
      const count = project.pool.length;
      project.pool.forEach(id => { delete project.cards[id]; });
      project.pool = [];
      selectedCard = null;
      resetRecording();
      changed();
      notify(`已清空 ${count} 张待选头像，可撤销。移动记录已重新开始`);
    }

    function resetLayout() {
      if (replay.active || importBusy) return;
      checkpoint();
      project.pool = [...project.rows.flatMap(row => row.items), ...project.pool];
      project.rows.forEach(row => { row.items = []; });
      project.positions = {};
      resetRecording();
      selectedCard = null;
      changed(true);
      notify('头像已移回待选区，移动记录已重新开始');
    }

    function bindEvents() {
      $('import-images').onclick = () => $('images-input').click();
      $('images-input').onchange = event => importImages(event.target.files);
      $('project-input').onchange = event => openProject(event.target.files[0]);
      $('open-project').onclick = () => { $('project-menu').open = false; $('project-input').click(); };
      $('save-html').onclick = saveHtml;
      $('export-png').onclick = exportPng;
      $('present').onclick = () => setPresent(true);
      $('exit-present').onclick = () => setPresent(false);
      $('present-pool').onchange = event => document.body.classList.toggle('pool-hidden', !event.target.checked);
      $('undo').onclick = () => undo();
      $('redo').onclick = () => undo(true);
      $('replay').onclick = playMoves;
      $('present-replay').onclick = playMoves;
      $('stop-replay').onclick = stopReplay;
      $('present-stop').onclick = stopReplay;
      $('clear-pool').onclick = clearPendingAvatars;
      $('reset-layout').onclick = resetLayout;
      $('present-reset-layout').onclick = resetLayout;
      $('project-title').onchange = event => { checkpoint(); project.title = event.target.value.trim() || '我的头像分级榜'; changed(); };
      for (const [id, option] of [['card-size', 'cardSize'], ['label-width', 'labelWidth']]) {
        $(id).addEventListener('pointerdown', () => { if (!replay.active) checkpoint(); });
        $(id).addEventListener('keydown', event => { if (event.key.startsWith('Arrow') || ['Home', 'End', 'PageUp', 'PageDown'].includes(event.key)) checkpoint(); });
        $(id).oninput = event => { project.options[option] = Number(event.target.value); changed(); };
      }
      $('show-names').onchange = event => { checkpoint(); project.options.showNames = event.target.checked; changed(); };
      $('new-project').onclick = () => {
        $('project-menu').open = false;
        if (replay.active || importBusy) return;
        checkpoint();
        project = emptyProject(project.id);
        selectedCard = null;
        changed();
        notify('已新建空白榜单，可用撤销恢复之前的内容');
      };
      $('load-demo').onclick = () => {
        if (replay.active || importBusy) return;
        const samples = JSON.parse($('demo-data').textContent);
        if (!samples.length) return;
        checkpoint();
        for (const sample of samples) {
          const id = newId();
          project.cards[id] = { id, ...sample };
          project.pool.push(id);
          project.baseline.pool.push(id);
        }
        changed();
        notify('已载入参考图中的 6 张示例头像，可以开始拖动');
      };
      $('add-row').onclick = () => {
        checkpoint();
        const row = { id: newId(), label: '新分级', color: '#b9c8da', items: [] };
        project.rows.push(row);
        project.baseline.rows[row.id] = [];
        changed();
        showRowEditor(row.id);
      };
      $('row-form').onsubmit = event => {
        event.preventDefault();
        checkpoint();
        const row = project.rows.find(row => row.id === editingRow);
        row.label = $('row-name').value.trim() || '未命名分级';
        row.color = $('row-color').value;
        $('row-dialog').close();
        changed();
      };
      $('row-up').onclick = () => reorderRow(-1);
      $('row-down').onclick = () => reorderRow(1);
      $('delete-row').onclick = () => {
        if (project.rows.length === 1) return;
        checkpoint();
        const row = project.rows.find(row => row.id === editingRow);
        returnToPool([...row.items]);
        project.rows = project.rows.filter(row => row.id !== editingRow);
        releaseBrokenBoundaries();
        resetRecording();
        $('row-dialog').close();
        changed();
        notify('该行头像已移回待选区，移动记录已重新开始');
      };
      $('card-form').onsubmit = event => {
        event.preventDefault();
        checkpoint();
        project.cards[editingCard] = { ...project.cards[editingCard], name: $('card-name').value.trim() || '未命名头像' };
        $('card-dialog').close();
        changed();
      };
      $('delete-card').onclick = () => {
        checkpoint();
        project.pool = project.pool.filter(id => id !== editingCard);
        project.rows.forEach(row => { row.items = row.items.filter(id => id !== editingCard); });
        delete project.positions[editingCard];
        delete project.cards[editingCard];
        resetRecording();
        $('card-dialog').close();
        changed();
        notify('头像已移除，移动记录已重新开始');
      };
      $('return-card').onclick = () => {
        if (moveCard(editingCard, 'pool')) changed(true);
        $('card-dialog').close();
      };
      document.querySelectorAll('[data-close]').forEach(button => { button.onclick = () => $(button.dataset.close).close(); });
      document.addEventListener('click', event => {
        if (replay.active || performance.now() < suppressClickUntil) return;
        const card = event.target.closest('.avatar-card');
        if (card) { selectedCard = selectedCard === card.dataset.cardId ? null : card.dataset.cardId; updateSelection(); return; }
        const label = event.target.closest('.tier-label');
        if (label) {
          const id = label.closest('.tier-row').dataset.rowId;
          if (selectedCard) placeSelected(id); else showRowEditor(id);
          return;
        }
        const container = event.target.closest('[data-container-id]');
        if (selectedCard && $('board').contains(event.target)) {
          const location = dropLocation(event);
          if (location && moveCard(selectedCard, location.target, location.index, true, location.position)) changed(true);
          return;
        }
        if (container && selectedCard) { placeSelected(container.dataset.containerId); return; }
        if (event.target.closest('.empty-pool')) $('images-input').click();
      });
      document.addEventListener('dblclick', event => {
        const card = event.target.closest('.avatar-card');
        if (card) showCardEditor(card.dataset.cardId);
      });
      document.addEventListener('pointerdown', event => {
        const card = event.target.closest('.avatar-card');
        if (!card || replay.active || importBusy || event.button !== 0 || !event.isPrimary) return;
        const rect = card.getBoundingClientRect();
        pointerDrag = { id: card.dataset.cardId, pointerId: event.pointerId, source: card, startX: event.clientX, startY: event.clientY, x: event.clientX, y: event.clientY, offsetX: event.clientX - rect.x, offsetY: event.clientY - rect.y, active: false, ghost: null };
        card.setPointerCapture(event.pointerId);
      });
      document.addEventListener('pointermove', event => {
        if (!pointerDrag || event.pointerId !== pointerDrag.pointerId) return;
        const drag = pointerDrag;
        drag.x = event.clientX;
        drag.y = event.clientY;
        if (!drag.active && Math.hypot(drag.x - drag.startX, drag.y - drag.startY) > 6) {
          drag.active = true;
          draggedCard = drag.id;
          drag.ghost = drag.source.cloneNode(true);
          drag.ghost.classList.remove('selected');
          drag.ghost.classList.add('drag-ghost');
          drag.ghost.setAttribute('aria-hidden', 'true');
          drag.ghost.tabIndex = -1;
          drag.source.classList.add('dragging');
          document.body.classList.add('placing');
          document.body.append(drag.ghost);
          requestAnimationFrame(scrollWhileDragging);
        }
        if (drag.active) { event.preventDefault(); updatePointerDrag(); }
      }, { passive: false });
      document.addEventListener('pointerup', event => {
        if (!pointerDrag || event.pointerId !== pointerDrag.pointerId) return;
        const drag = pointerDrag;
        if (!drag.active) { finishPointerDrag(); return; }
        event.preventDefault();
        drag.x = event.clientX;
        drag.y = event.clientY;
        const location = pointerLocation(drag);
        const origin = { id: drag.id, rect: drag.ghost.getBoundingClientRect() };
        const id = drag.id;
        suppressClickUntil = performance.now() + 250;
        finishPointerDrag();
        if (location && moveCard(id, location.target, location.index, true, location.position)) changed(true, origin);
        else render(true, origin);
      });
      document.addEventListener('pointercancel', finishPointerDrag);
      document.addEventListener('dragstart', event => { if (event.target.closest('.avatar-card')) event.preventDefault(); });
      document.addEventListener('dragover', event => {
        if (replay.active || importBusy) return;
        if (Array.from(event.dataTransfer.types).includes('Files')) { event.preventDefault(); $('pool').classList.add('drop-over'); }
      });
      document.addEventListener('drop', event => {
        if (replay.active || importBusy) return;
        if (event.dataTransfer.files.length) { event.preventDefault(); clearDropHints(); importImages(event.dataTransfer.files); }
      });
      document.addEventListener('dragend', clearDropHints);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if (pointerDrag) finishPointerDrag();
          else if (replay.active) stopReplay();
          else if (document.querySelector('dialog[open]')) return;
          else if (document.body.classList.contains('presenting')) setPresent(false);
          else { selectedCard = null; render(); }
          return;
        }
        if (event.target.matches('input, textarea, select, [contenteditable]')) return;
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); undo(event.shiftKey); }
        const offsets = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        if (selectedCard && project.positions[selectedCard] && offsets[event.key] && !replay.active) {
          event.preventDefault();
          const id = selectedCard;
          const current = project.positions[id];
          const offset = offsets[event.key];
          const half = halfRow(current) + offset[1];
          if (half < 0 || half > (project.rows.length - 1) * 2) return;
          const rowIndex = Math.floor(half / 2);
          const position = { rowId: project.rows[rowIndex].id, column: current.column + offset[0] };
          if (half % 2) position.nextRowId = project.rows[rowIndex + 1].id;
          if (moveCard(id, position.rowId, undefined, true, position)) {
            selectedCard = id;
            changed(true);
          }
          return;
        }
        if (selectedCard && /^[1-9]$/.test(event.key)) {
          const row = project.rows[Number(event.key) - 1];
          if (row) { event.preventDefault(); placeSelected(row.id); }
        }
      });
      const options = $('color-options');
      palette.forEach(color => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'swatch';
        button.style.background = color;
        button.setAttribute('aria-label', '选择颜色 ' + color);
        button.onclick = () => { $('row-color').value = color; };
        options.append(button);
      });
      const colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.id = 'row-color';
      colorInput.setAttribute('aria-label', '自定义行背景颜色');
      options.append(colorInput);
      window.addEventListener('resize', () => { if (!pointerDrag?.active) render(); });
    }

    async function initialize() {
      try {
        const embedded = JSON.parse($('saved-state').textContent);
        project = embedded.format ? validateProject(embedded) : emptyProject('avatar-tier-default');
      } catch { project = emptyProject('avatar-tier-default'); notify('内嵌榜单无法读取，已打开空白编辑器'); }
      try {
        database = await openDatabase();
        const local = await readLocalProject(project.id);
        if (local && local.updatedAt > project.updatedAt) project = validateProject(local);
        setSaveStatus('已自动保存到此浏览器');
      } catch { database = null; setSaveStatus('请用“保存完整 HTML”保留榜单', true); }
      bindEvents();
      render();
    }
    initialize();
  </script>
</body>
</html>
